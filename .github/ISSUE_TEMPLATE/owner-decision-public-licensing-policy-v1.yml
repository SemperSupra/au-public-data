name: AU Public Data licensing decision
description: Record the owner decision for public software licensing, generated-data policy, and source-artifact redistribution.
title: "[Owner decision][public-licensing-policy:v1] "
body:
  - type: markdown
    attributes:
      value: |
        ## AU Public Data licensing and redistribution policy

        Decision ID: `public-licensing-policy`
        Version: `1`

        This public form is the canonical browser submission surface for this public-project policy decision. Nothing below is preselected. Recommended choices are guidance only.

        Related work:
        - `SemperSupra/au-public-data#2`
        - `SemperSupra/surge-halo-private#24`

  - type: dropdown
    id: software_license
    attributes:
      label: "[software_license] Project-original public software license"
      description: "Recommended: apache-2.0 — explicit patent/contribution terms and a good fit for a long-lived collaborative open-source tool."
      options:
        - "apache-2.0 — Apache-2.0"
        - "mit — MIT"
        - "defer — Defer this decision"
    validations:
      required: true

  - type: dropdown
    id: generated_data_policy
    attributes:
      label: "[generated_data_policy] Project-owned generated-data policy"
      description: "Recommended: cc0-1.0 — broad reuse of project-owned factual normalization/metadata, to the extent the project has rights to dedicate it."
      options:
        - "cc0-1.0 — CC0-1.0"
        - "pddl-1.0 — ODC PDDL-1.0"
        - "odbl-1.0 — ODbL-1.0"
        - "defer — Defer this decision"
    validations:
      required: true

  - type: dropdown
    id: source_artifact_policy
    attributes:
      label: "[source_artifact_policy] Default redistribution posture for third-party AU source artifacts"
      description: "Recommended: links-provenance-by-default — publish links, hashes, provenance, and normalized facts by default; redistribute source artifacts only after source-specific review."
      options:
        - "links-provenance-by-default — Links/provenance by default"
        - "source-by-source — Always decide source by source"
        - "publicly-accessible-by-default — Republish publicly accessible artifacts by default"
        - "defer — Defer this decision"
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: "[rationale] Optional rationale or constraints"
      description: "Add anything future agents should preserve when implementing the selected policy. Leave blank if the structured choices are sufficient."
      placeholder: "Optional notes"

  - type: checkboxes
    id: confirmation
    attributes:
      label: "[confirmation] Confirmation"
      description: "This acknowledgement is provenance only; the normalization step will independently validate all required answers."
      options:
        - label: "I intend these selections to be the owner decision for public-licensing-policy v1."
          required: true
